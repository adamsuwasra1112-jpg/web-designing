
<!DOCTYPE html>
<html>
<head>
    <title>Web Designing</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f8ff;
            margin: 0;
        }

        header {
            background: #003366;
            color: white;
            padding: 20px;
        }

        nav {
            background: #008080;
            padding: 12px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        section {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 80%;
            border-radius: 10px;
        }

        h2 {
            color: #003366;
        }
    </style>
</head>

<body>

<header>
    <h1>Web Designing</h1>
    <p>Learn HTML, CSS and JavaScript</p>
</header>

<nav>
    <a href="#html">HTML</a>
    <a href="#css">CSS</a>
    <a href="#javascript">JavaScript</a>
</nav>

<section id="html">
    <h2>HTML</h2>
    <p>HTML creates the structure of a web page.</p>
</section>

<section id="css">
    <h2>CSS</h2>
    <p>CSS adds colours, styles and layouts.</p>
</section>

<section id="javascript">
    <h2>JavaScript</h2>
    <p>JavaScript adds interactivity to websites.</p>
</section>

<footer>
    <p>Web Designing Practical Project</p>
</footer>

</body>
</html>
